spring.application.name=danpss-backend

# Render assigns port dynamically via $PORT
server.port=${PORT:8080}

# Enable error messages in JSON responses
server.error.include-message=always
server.error.include-binding-errors=always

# Database: Uses DB_URL if provided (e.g. TiDB Cloud). If not, uses embedded in-memory database
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:h2:mem:danpss_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

# JPA and Hibernate (Dialect auto-detected)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
