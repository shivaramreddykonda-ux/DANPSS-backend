spring.application.name=danpss-backend

# Render assigns port dynamically via $PORT
server.port=${PORT:8080}

# Enable error messages in JSON responses
server.error.include-message=always
server.error.include-binding-errors=always

# TiDB Cloud Database Configuration
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/danpss_db?sslMode=VERIFY_IDENTITY}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:4QdRFBPvK8sBDJh.root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:JzVaTpV16Zd8Pd51}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
