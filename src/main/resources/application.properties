spring.application.name=danpss-backend

# Server port: Render dynamically injects $PORT
server.port=${PORT:8080}

# Database configuration:
# 1. Connects to TiDB Cloud when DB_URL is set in Render
# 2. Defaults to an embedded persistent database so login/register work immediately without 500 errors!
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/danpss_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

# JPA and Hibernate configuration (Hibernate auto-detects dialect)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
